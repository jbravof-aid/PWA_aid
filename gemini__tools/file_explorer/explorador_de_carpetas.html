<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Carpetas e IndexedDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        /* Estilos personalizados para el scrollbar y árbol */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tree-line {
            position: absolute;
            left: 11px;
            top: 24px;
            bottom: -8px;
            width: 2px;
            background-color: #e2e8f0;
            z-index: 0;
        }
        .tree-item { position: relative; z-index: 1; }
        .folder-toggle { cursor: pointer; user-select: none; }
        .folder-children { transition: all 0.2s ease; overflow: hidden; }
        .collapsed { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-white border-b shadow-sm p-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            <h1 class="text-xl font-bold text-gray-700">Explorador de Archivos y DB</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <input type="file" id="folder-input" webkitdirectory directory class="hidden" />
            <button id="btn-select-folder" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium transition-colors shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Seleccionar Carpeta
            </button>
            <div class="h-8 w-px bg-gray-300 mx-2"></div>
            <input type="text" id="db-name" placeholder="Nombre de la Base de Datos" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64" value="MiSistemaDeArchivos">
            <button id="btn-save-db" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                Guardar en IndexedDB
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Panel Izquierdo: Árbol de carpetas -->
        <aside class="w-1/3 min-w-[300px] border-r bg-white flex flex-col relative">
            <div class="p-3 bg-gray-100 border-b text-sm font-semibold text-gray-600 flex justify-between items-center">
                <span>Estructura del Sistema</span>
                <span id="stats-badge" class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full hidden"></span>
            </div>
            <div id="tree-container" class="flex-1 overflow-y-auto p-4 relative">
                <div id="empty-state" class="text-center text-gray-400 mt-10">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                    <p>Haz clic en "Seleccionar Carpeta" para comenzar.</p>
                </div>
                <!-- El árbol se renderizará aquí -->
            </div>
        </aside>

        <!-- Panel Derecho: Visor de Archivos -->
        <section class="w-2/3 bg-gray-50 flex flex-col">
            <div class="p-3 bg-white border-b text-sm font-semibold text-gray-600 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                Previsualización
                <span id="preview-filename" class="ml-2 font-normal text-gray-500 truncate"></span>
            </div>
            <div id="preview-container" class="flex-1 overflow-auto p-6 flex justify-center items-center">
                <div class="text-gray-400 flex flex-col items-center">
                    <svg class="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p>Selecciona un archivo del árbol para previsualizarlo</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de notificación (reemplaza alert) -->
    <div id="notification-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full transform scale-95 transition-transform">
            <h3 id="modal-title" class="text-lg font-bold mb-2">Mensaje</h3>
            <p id="modal-message" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end">
                <button id="btn-close-modal" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-colors">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        // Estado Global de la Aplicación
        let fileSystemData = {
            carpetas: [], // [{ id, nombre, ruta, rutaPadre }]
            archivos: []  // [{ id, nombre, ruta, rutaCarpeta, tipo, tamano, handle }]
        };
        let counterFolders = 0;
        let counterFiles = 0;

        // Elementos del DOM
        const btnSelectFolder = document.getElementById('btn-select-folder');
        const btnSaveDb = document.getElementById('btn-save-db');
        const dbNameInput = document.getElementById('db-name');
        const treeContainer = document.getElementById('tree-container');
        const emptyState = document.getElementById('empty-state');
        const previewContainer = document.getElementById('preview-container');
        const previewFilename = document.getElementById('preview-filename');
        const statsBadge = document.getElementById('stats-badge');
        
        // Modal UI
        const notificationModal = document.getElementById('notification-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const btnCloseModal = document.getElementById('btn-close-modal');

        function showModal(title, message, isError = false) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalTitle.className = `text-lg font-bold mb-2 ${isError ? 'text-red-600' : 'text-gray-800'}`;
            notificationModal.classList.remove('hidden');
            // Timeout para permitir que la transición CSS se aplique
            setTimeout(() => {
                notificationModal.classList.remove('opacity-0');
                notificationModal.firstElementChild.classList.remove('scale-95');
                notificationModal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        btnCloseModal.addEventListener('click', () => {
            notificationModal.classList.add('opacity-0');
            notificationModal.firstElementChild.classList.remove('scale-100');
            notificationModal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                notificationModal.classList.add('hidden');
            }, 200);
        });

        // Iconos SVG reutilizables
        const icons = {
            folderClosed: `<svg class="w-5 h-5 text-yellow-500 mr-2 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"></path></svg>`,
            folderOpen: `<svg class="w-5 h-5 text-yellow-500 mr-2 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"></path></svg>`,
            fileCode: `<svg class="w-5 h-5 text-blue-500 mr-2 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>`,
            fileImage: `<svg class="w-5 h-5 text-green-500 mr-2 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
            fileText: `<svg class="w-5 h-5 text-gray-500 mr-2 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`
        };

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp'].includes(ext)) return icons.fileImage;
            if (['html', 'css', 'js', 'json', 'ts', 'jsx', 'tsx'].includes(ext)) return icons.fileCode;
            return icons.fileText;
        }

        btnSelectFolder.addEventListener('click', async () => {
            if (!('showDirectoryPicker' in window)) {
                showModal('API No Soportada', 'Tu navegador no soporta la File System Access API. Por favor, usa Chrome, Edge u Opera en una conexión segura (HTTPS o localhost).', true);
                return;
            }

            try {
                const directoryHandle = await window.showDirectoryPicker({ mode: 'read' });
                
                // Resetear estado
                fileSystemData = { carpetas: [], archivos: [] };
                counterFolders = 0;
                counterFiles = 0;
                treeContainer.innerHTML = ''; // Limpiar UI
                emptyState.style.display = 'none';

                // Procesar la carpeta raíz
                await processDirectory(directoryHandle, directoryHandle.name, null);
                
                // Actualizar interfaz
                renderTree();
                btnSaveDb.disabled = false;
                statsBadge.textContent = `${counterFolders} carpetas, ${counterFiles} archivos`;
                statsBadge.classList.remove('hidden');

            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error(error);
                    showModal('Error', 'No se pudo acceder a la carpeta: ' + error.message, true);
                }
            }
        });

        async function processDirectory(dirHandle, currentPath, parentPath) {
            const folderId = `folder_${counterFolders++}`;
            const folderData = {
                id: folderId,
                nombre: dirHandle.name,
                ruta: currentPath,
                rutaPadre: parentPath,
                handle: dirHandle
            };
            fileSystemData.carpetas.push(folderData);

            try {
                for await (const entry of dirHandle.values()) {
                    const entryPath = `${currentPath}/${entry.name}`;
                    
                    if (entry.kind === 'directory') {
                        await processDirectory(entry, entryPath, currentPath);
                    } else if (entry.kind === 'file') {
                        // Obtenemos metadatos básicos sin cargar el contenido completo en memoria aún
                        const file = await entry.getFile(); 
                        fileSystemData.archivos.push({
                            id: `file_${counterFiles++}`,
                            nombre: entry.name,
                            ruta: entryPath,
                            rutaCarpeta: currentPath,
                            tipo: file.type || getExtensionType(entry.name),
                            tamano: file.size,
                            handle: entry // Guardamos el handle para leer el contenido luego
                        });
                    }
                }
            } catch (error) {
                console.warn(`No se pudo leer el contenido de ${currentPath}:`, error);
            }
        }

        function getExtensionType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const map = {
                'txt': 'text/plain', 'html': 'text/html', 'css': 'text/css', 'js': 'text/javascript',
                'json': 'application/json', 'xml': 'application/xml', 'csv': 'text/csv'
            };
            return map[ext] || 'application/octet-stream';
        }

        const folderInput = document.getElementById('folder-input');

        btnSelectFolder.addEventListener('click', () => {
            folderInput.click();
        });

        folderInput.addEventListener('change', (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            try {
                // Resetear estado
                fileSystemData = { carpetas: [], archivos: [] };
                counterFolders = 0;
                counterFiles = 0;
                treeContainer.innerHTML = ''; // Limpiar UI
                emptyState.style.display = 'none';

                const addedFolders = new Set();

                // Procesamos cada archivo descubierto por el input
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    // webkitRelativePath contiene la ruta completa desde la raíz seleccionada
                    const pathParts = file.webkitRelativePath.split('/');
                    
                    let currentPath = '';
                    let parentPath = null;

                    // Procesar y crear las carpetas en la ruta del archivo si no existen
                    for (let j = 0; j < pathParts.length - 1; j++) {
                        const folderName = pathParts[j];
                        parentPath = currentPath === '' ? null : currentPath;
                        currentPath = currentPath === '' ? folderName : `${currentPath}/${folderName}`;
                        
                        if (!addedFolders.has(currentPath)) {
                            addedFolders.add(currentPath);
                            fileSystemData.carpetas.push({
                                id: `folder_${counterFolders++}`,
                                nombre: folderName,
                                ruta: currentPath,
                                rutaPadre: parentPath
                            });
                        }
                    }

                    // Extraer los detalles del archivo final
                    const fileName = pathParts[pathParts.length - 1];
                    fileSystemData.archivos.push({
                        id: `file_${counterFiles++}`,
                        nombre: fileName,
                        ruta: file.webkitRelativePath,
                        rutaCarpeta: currentPath,
                        tipo: file.type || getExtensionType(fileName),
                        tamano: file.size,
                        fileObj: file // Guardamos el objeto File tradicional
                    });
                }
                
                // Actualizar interfaz
                renderTree();
                btnSaveDb.disabled = false;
                statsBadge.textContent = `${counterFolders} carpetas, ${counterFiles} archivos`;
                statsBadge.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                showModal('Error', 'No se pudo procesar la carpeta: ' + error.message, true);
            }
            
            // Limpiar input para permitir seleccionar la misma carpeta si se desea repetir
            folderInput.value = '';
        });

        function renderTree() {
            treeContainer.innerHTML = '';
            
            // Encontrar la carpeta raíz (la que no tiene padre)
            const rootFolders = fileSystemData.carpetas.filter(c => c.rutaPadre === null);
            
            rootFolders.forEach(rootFolder => {
                const rootNode = createTreeNode(rootFolder);
                treeContainer.appendChild(rootNode);
            });
        }

        function createTreeNode(folder) {
            const div = document.createElement('div');
            div.className = 'tree-item mb-1 pl-4 relative';
            
            // Header de la carpeta
            const header = document.createElement('div');
            header.className = 'folder-toggle flex items-center py-1.5 px-2 hover:bg-gray-200 rounded text-gray-700 font-medium';
            
            const iconContainer = document.createElement('span');
            iconContainer.innerHTML = icons.folderOpen;
            
            const textSpan = document.createElement('span');
            textSpan.textContent = folder.nombre;
            textSpan.className = 'truncate';
            
            header.appendChild(iconContainer);
            header.appendChild(textSpan);
            
            // Contenedor para hijos
            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'folder-children relative border-l border-gray-200 ml-2 mt-1';
            
            // Poblar hijos (subcarpetas y archivos)
            const subfolders = fileSystemData.carpetas.filter(c => c.rutaPadre === folder.ruta);
            const files = fileSystemData.archivos.filter(a => a.rutaCarpeta === folder.ruta);
            
            subfolders.forEach(sub => {
                childrenContainer.appendChild(createTreeNode(sub));
            });
            
            files.forEach(file => {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'flex items-center py-1.5 px-2 ml-4 hover:bg-blue-50 rounded cursor-pointer text-gray-600 text-sm group';
                fileDiv.innerHTML = `${getFileIcon(file.nombre)} <span class="truncate group-hover:text-blue-600 transition-colors">${file.nombre}</span>`;
                
                fileDiv.addEventListener('click', () => {
                    // Remover estilos activos de otros archivos
                    document.querySelectorAll('.file-active').forEach(el => el.classList.remove('file-active', 'bg-blue-100', 'text-blue-700', 'font-medium'));
                    fileDiv.classList.add('file-active', 'bg-blue-100', 'text-blue-700', 'font-medium');
                    previewFile(file);
                });
                
                childrenContainer.appendChild(fileDiv);
            });

            // Lógica de toggle para abrir/cerrar carpeta
            let isOpen = true;
            header.addEventListener('click', () => {
                isOpen = !isOpen;
                iconContainer.innerHTML = isOpen ? icons.folderOpen : icons.folderClosed;
                childrenContainer.classList.toggle('collapsed');
            });

            div.appendChild(header);
            div.appendChild(childrenContainer);
            return div;
        }

        async function previewFile(fileData) {
            previewFilename.textContent = ` - ${fileData.nombre}`;
            previewContainer.innerHTML = '<div class="text-blue-500 animate-pulse">Cargando contenido...</div>';
            
            try {
                const file = fileData.fileObj;
                const type = file.type || fileData.tipo;
                
                // Si es imagen
                if (type.startsWith('image/')) {
                    const objectUrl = URL.createObjectURL(file);
                    previewContainer.innerHTML = `<img src="${objectUrl}" alt="${fileData.nombre}" class="max-w-full max-h-full object-contain shadow-md rounded border">`;
                    // Liberar URL al cambiar
                    previewContainer.dataset.objectUrl = objectUrl; 
                    return;
                }
                
                // Liberar URL anterior si existe
                if (previewContainer.dataset.objectUrl) {
                    URL.revokeObjectURL(previewContainer.dataset.objectUrl);
                    delete previewContainer.dataset.objectUrl;
                }

                // Si es texto (código, txt, json, etc) o no superamos un límite razonable (ej 1MB) para intentar leerlo
                if (type.startsWith('text/') || type.includes('json') || type.includes('javascript') || type.includes('xml') || file.size < 1000000) {
                    try {
                        const text = await file.text();
                        // Prevenir renderizado HTML interpretado, usamos textContent
                        const pre = document.createElement('pre');
                        pre.className = 'w-full h-full p-4 bg-gray-900 text-gray-100 rounded overflow-auto font-mono text-sm leading-relaxed whitespace-pre-wrap';
                        pre.textContent = text;
                        previewContainer.innerHTML = '';
                        previewContainer.appendChild(pre);
                    } catch (e) {
                        renderGenericFile(fileData, 'No se pudo leer como texto.');
                    }
                } else {
                    // Otros formatos (binarios, zips, videos grandes, etc)
                    renderGenericFile(fileData, 'Formato no soportado para vista previa.');
                }
            } catch (error) {
                previewContainer.innerHTML = `<div class="text-red-500">Error al leer el archivo: ${error.message}</div>`;
            }
        }

        function renderGenericFile(file, msg) {
            const sizeKB = (file.tamano / 1024).toFixed(2);
            previewContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center text-gray-500 bg-white p-8 rounded-lg shadow-sm border">
                    ${icons.fileText.replace('w-5 h-5 mr-2 shrink-0', 'w-16 h-16 mb-4')}
                    <h3 class="text-xl font-medium text-gray-800 mb-2">${file.nombre}</h3>
                    <p class="text-sm mb-1"><strong>Tipo:</strong> ${file.tipo || 'Desconocido'}</p>
                    <p class="text-sm mb-4"><strong>Tamaño:</strong> ${sizeKB} KB</p>
                    <div class="px-4 py-2 bg-gray-100 text-gray-600 rounded-md text-sm italic">${msg}</div>
                </div>
            `;
        }

        btnSaveDb.addEventListener('click', async () => {
            const dbName = dbNameInput.value.trim() || 'MiSistemaDeArchivos';
            
            btnSaveDb.disabled = true;
            btnSaveDb.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Guardando...';

            try {
                // Eliminar la BD anterior si existe para asegurar un esquema limpio basado en las carpetas actuales
                await Dexie.delete(dbName);
                
                const db = new Dexie(dbName);
                
                // 1. Crear el esquema dinámicamente según los requisitos del usuario
                // "una tabla recogiendo todas las carpetas... y luego una tabla por carpeta con los archivos"
                
                const schema = {
                    carpetas: 'ruta, nombre, rutaPadre' // Tabla principal de carpetas
                };

                // Función auxiliar para sanitizar rutas y usarlas como nombres de tabla seguros
                const getTableNameFromPath = (path) => {
                    // Reemplazamos barras, espacios y caracteres extraños con guiones bajos
                    const safeName = path.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    return 'archivos_' + (safeName || 'raiz');
                };

                // Crear una entrada en el esquema para CADA carpeta existente
                fileSystemData.carpetas.forEach(carpeta => {
                    const tableName = getTableNameFromPath(carpeta.ruta);
                    // Índice principal: ruta del archivo. También indexamos por nombre y tipo.
                    schema[tableName] = 'ruta, nombre, tipo, tamano';
                    carpeta.tableName = tableName; // Guardamos la referencia
                });

                // Inicializar versión con el esquema dinámico
                db.version(1).stores(schema);

                // 2. Insertar los datos
                
                // Preparar datos de carpetas
                const carpetasAInsertar = fileSystemData.carpetas.map(c => ({
                    ruta: c.ruta,
                    nombre: c.nombre,
                    rutaPadre: c.rutaPadre
                }));
                
                // Guardar en tabla de carpetas
                await db.carpetas.bulkPut(carpetasAInsertar);

                // Preparar e insertar archivos en sus respectivas tablas
                // Agrupamos los archivos por la tabla a la que pertenecen
                const archivosPorTabla = {};
                
                fileSystemData.archivos.forEach(archivo => {
                    // Buscar a qué tabla pertenece (la de su carpeta)
                    const carpetaPadre = fileSystemData.carpetas.find(c => c.ruta === archivo.rutaCarpeta);
                    if (carpetaPadre) {
                        const tableName = carpetaPadre.tableName;
                        if (!archivosPorTabla[tableName]) {
                            archivosPorTabla[tableName] = [];
                        }
                        archivosPorTabla[tableName].push({
                            ruta: archivo.ruta,
                            nombre: archivo.nombre,
                            tipo: archivo.tipo,
                            tamano: archivo.tamano,
                            // Guardamos el objeto File en IndexedDB para persistencia
                            fileObj: archivo.fileObj 
                        });
                    }
                });

                // Insertar cada grupo de archivos en su tabla correspondiente dinámicamente
                const promesasInsercion = Object.keys(archivosPorTabla).map(tableName => {
                    return db.table(tableName).bulkPut(archivosPorTabla[tableName]);
                });

                await Promise.all(promesasInsercion);

                showModal('¡Éxito!', `Se ha creado la base de datos "${dbName}" en IndexedDB con éxito. \nSe crearon ${Object.keys(archivosPorTabla).length} tablas dinámicas para organizar los ${fileSystemData.archivos.length} archivos.`);

            } catch (error) {
                console.error("Error al guardar en IndexedDB:", error);
                showModal('Error Base de Datos', 'Ocurrió un error al guardar en IndexedDB: ' + error.message, true);
            } finally {
                // Restaurar botón
                btnSaveDb.disabled = false;
                btnSaveDb.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg> Guardar en IndexedDB';
            }
        });

    </script>
</body>
</html>
